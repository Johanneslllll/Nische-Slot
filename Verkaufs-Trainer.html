<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verkaufs-Trainer</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1f24;--muted:#6a6f7a;--line:#e4e2dc;--acc:#2f5bea;--acc2:#e9eefe;--ok:#1f8a4c;--okbg:#e5f5ec;--warn:#a86a00;--warnbg:#fdf2dc;--bad:#c23b3b;--badbg:#fbe7e7;--say:#f1f4ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121317;--card:#1b1d23;--ink:#eceef2;--muted:#9aa0ab;--line:#2c2f37;--acc:#7c9bff;--acc2:#232a44;--ok:#4cc57f;--okbg:#17301f;--warn:#e0a63a;--warnbg:#33290f;--bad:#ef6b6b;--badbg:#3a1c1c;--say:#1f2436}}
:root[data-theme="dark"]{--bg:#121317;--card:#1b1d23;--ink:#eceef2;--muted:#9aa0ab;--line:#2c2f37;--acc:#7c9bff;--acc2:#232a44;--ok:#4cc57f;--okbg:#17301f;--warn:#e0a63a;--warnbg:#33290f;--bad:#ef6b6b;--badbg:#3a1c1c;--say:#1f2436}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:980px;margin:0 auto;padding:16px 16px 80px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:24px;margin:0;letter-spacing:-.02em}h1 span{color:var(--acc)}
h2{font-size:20px;margin:0 0 6px}h3{font-size:17px;margin:0 0 8px}
.sub{color:var(--muted);margin:0 0 16px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.pill b{color:var(--acc)}
nav{display:flex;gap:6px;overflow-x:auto;padding:4px 0 12px;margin-bottom:8px;scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:5}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 14px;font-size:15px;cursor:pointer}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.grid .card{margin:0}
.btn{border:0;background:var(--acc);color:#fff;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer;font-weight:600}
.btn.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc)}
.btn.sm{padding:6px 11px;font-size:14px}
.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}.btn.bad{background:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.say{background:var(--say);border-left:4px solid var(--acc);border-radius:8px;padding:12px 14px;margin:8px 0;font-style:italic}
.why{color:var(--muted);font-size:14.5px;margin:4px 0}
.avoid{background:var(--badbg);color:var(--bad);border-radius:8px;padding:8px 12px;font-size:14.5px;margin:6px 0}
.tip{background:var(--okbg);color:var(--ok);border-radius:8px;padding:8px 12px;font-size:14.5px;margin:6px 0}
.limit{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:14.5px;margin:6px 0}
.step{border-top:1px solid var(--line);padding:14px 0}.step:first-of-type{border-top:0;padding-top:4px}
.step h4{margin:0 0 4px;font-size:16px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;font-size:14.5px}
.seg button.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:600}
details{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:8px 0;background:var(--card)}
summary{cursor:pointer;font-weight:600}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 14px;margin:8px 0;cursor:pointer;font-size:15.5px}
.opt.best{border-color:var(--ok);background:var(--okbg)}.opt.mid{border-color:var(--warn);background:var(--warnbg)}.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 2px}.bar i{display:block;height:100%;background:var(--acc)}
.big{font-size:19px;font-weight:600;margin:6px 0 10px}
label{display:block;font-size:14px;color:var(--muted);margin:8px 0 4px}
input,textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:9px;padding:10px;font:inherit}
textarea{min-height:80px;resize:vertical}
.badge{display:inline-block;font-size:12.5px;padding:2px 8px;border-radius:99px;background:var(--acc2);color:var(--acc);margin-right:4px}
.badge.g{background:var(--okbg);color:var(--ok)}.badge.y{background:var(--warnbg);color:var(--warn)}.badge.r{background:var(--badbg);color:var(--bad)}
.flash{min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:21px;font-weight:600;padding:20px}
.muted{color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0}.check input{width:auto;margin-top:5px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
pre.out{white-space:pre-wrap;background:var(--say);border-radius:10px;padding:14px;font:15px/1.55 inherit;margin:0}
@media (max-width:520px){.wrap{padding:12px 16px 80px}h1{font-size:21px}.card{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Verkaufs-<span>Trainer</span></h1></div>
  <div class="stats" id="stats"></div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
</div>
<div class="toast" id="toast"></div>

const LEVELS = [[0,"Einsteiger"],[100,"Telefon-Starter"],[250,"Gesprächsführer"],[500,"Closer"],[900,"Top-Verkäufer"],[1500,"Verkaufs-Meister"]];

/* ===================== STATE ===================== */
const KEY = "verkaufsTrainerV1";
const today = () => new Date().toISOString().slice(0,10);
let st = {pts:0, days:[], done:{}, cards:{}, quizBest:0, simBest:0, journal:[], pitch:{}, chal:{}, tab:"heute"};
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) st = Object.assign(st, s); } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e) {} };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function toast(t){ const e=$("toast"); e.textContent=t; e.classList.add("on"); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove("on"),1800); }
function addPts(n, msg){ st.pts += n; if (!st.days.includes(today())) st.days.push(today()); save(); stats(); if (msg) toast(`+${n} Punkte · ${msg}`); }
function level(){ let l=LEVELS[0], next=null; for (let i=0;i<LEVELS.length;i++){ if (st.pts>=LEVELS[i][0]) { l=LEVELS[i]; next=LEVELS[i+1]||null; } } return {l,next}; }
function streak(){ let n=0; const d=new Date(); if(!st.days.includes(today())) d.setDate(d.getDate()-1); while(st.days.includes(d.toISOString().slice(0,10))){ n++; d.setDate(d.getDate()-1); } return n; }
function stats(){ const {l}=level(); $("stats").innerHTML = `<span class="pill">🏅 <b>${esc(l[1])}</b></span><span class="pill">⭐ <b>${st.pts}</b> Punkte</span><span class="pill">🔥 <b>${streak()}</b> Tage</span>`; }

/* ===================== TABS ===================== */
const TABS = [["heute","Heute"],["leit","Leitfäden"],["auftritt","Auftreten"],["psy","Psychologie"],["einw","Einwände"],["sim","Simulator"],["quiz","Quiz"],["pitch","Mein Pitch"],["journal","Journal"]];
function nav(){ $("nav").innerHTML = TABS.map(([k,t]) => `<button class="${st.tab==k?"on":""}" data-tab="${k}">${t}</button>`).join(""); }
function go(t){ st.tab=t; save(); nav(); render(); window.scrollTo({top:0}); }

let guide = "kalt", simI = 0, simScore = 0, simAns = null, quizI = 0, quizScore = 0, quizAns = null, cardI = 0, cardOpen = false, psyOpen = -1;

function render(){
  const m = $("main");
  const f = {heute, leit, auftritt, psy, einw, sim, quiz, pitch, journal}[st.tab] || heute;
  m.innerHTML = f();
}

/* --- Heute --- */
function heute(){
  const {l,next} = level();
  const pct = next ? Math.round((st.pts-l[0])/(next[0]-l[0])*100) : 100;
  const dayNo = Math.floor(Date.now()/864e5);
  const ch = CHALLENGES[dayNo % CHALLENGES.length];
  const chDone = st.chal[today()];
  const green = Object.values(st.cards).filter(v=>v=="g").length;
  const stepsDone = Object.keys(st.done).length;
  const allSteps = Object.values(GUIDES).reduce((a,g)=>a+g.steps.length,0);
  return `
  <div class="card"><h2>Hallo! Bereit für dein Training?</h2>
  <p class="sub">Zehn Minuten am Tag reichen. Wichtig ist, dass du alles <b>laut</b> übst, nicht nur liest.</p>
  <div class="muted">Level: <b>${esc(l[1])}</b>${next?` · noch ${next[0]-st.pts} Punkte bis „${esc(next[1])}“`:" · höchstes Level erreicht"}</div>
  <div class="bar"><i style="width:${pct}%"></i></div></div>
  <div class="card"><h3>🎯 Challenge des Tages</h3><p class="big">${esc(ch)}</p>
  ${chDone?`<span class="badge g">✓ Erledigt</span>`:`<button class="btn" data-act="chal">Erledigt (+15)</button>`}</div>
  <div class="grid">
    <div class="card"><h3>Leitfäden</h3><p class="muted">${stepsDone} von ${allSteps} Schritten geübt</p><div class="bar"><i style="width:${Math.round(stepsDone/allSteps*100)}%"></i></div><button class="btn ghost sm" data-tab="leit" style="margin-top:8px">Weiter üben</button></div>
    <div class="card"><h3>Einwände</h3><p class="muted">${green} von ${OBJ.length} sicher (grün)</p><div class="bar"><i style="width:${Math.round(green/OBJ.length*100)}%"></i></div><button class="btn ghost sm" data-tab="einw" style="margin-top:8px">Karten üben</button></div>
    <div class="card"><h3>Simulator & Quiz</h3><p class="muted">Bester Simulator: ${st.simBest} / ${SIMS.length*10}<br>Bestes Quiz: ${st.quizBest} / ${QUIZ.length}</p><button class="btn ghost sm" data-tab="sim" style="margin-top:8px">Simulator starten</button></div>
  </div>
  <div class="card" style="margin-top:14px"><h3>So nutzt du den Trainer</h3>
  <p>1. <b>Leitfäden</b> lesen und jeden Satz einmal laut sprechen. 2. <b>Einwände</b> als Karteikarten üben, bis alle grün sind. 3. Im <b>Simulator</b> testen, wie du reagierst. 4. In <b>Mein Pitch</b> deinen eigenen Leitfaden erstellen. 5. Nach jedem echten Gespräch ins <b>Journal</b> schreiben.</p>
  <div class="row"><button class="btn ghost sm" data-act="export">⬇ Fortschritt sichern</button><label class="btn ghost sm" style="display:inline-block;margin:0;color:var(--acc);cursor:pointer">⬆ Sicherung laden<input type="file" id="imp" accept=".json" hidden></label></div>
  <p class="muted" style="font-size:13.5px;margin-top:8px">Dein Fortschritt wird nur in diesem Browser gespeichert. Mit „Fortschritt sichern“ nimmst du ihn auf ein anderes Gerät mit.</p></div>`;
}

/* --- Leitfäden --- */
function leit(){
  const g = GUIDES[guide];
  return `<div class="seg">${Object.entries(GUIDES).map(([k,v])=>`<button class="${guide==k?"on":""}" data-guide="${k}">${v.name}</button>`).join("")}</div>
  <div class="card"><h2>${g.name}</h2><p class="sub">${g.goal}</p>
  ${g.steps.map((s,i)=>{ const k=guide+i, d=st.done[k]; return `<div class="step"><h4>${esc(s[0])}</h4>
  <div class="say">„${esc(s[1])}“</div><p class="why">💡 ${esc(s[2])}</p><div class="avoid">✗ ${esc(s[3])}</div>
  ${d?`<span class="badge g">✓ Laut geübt</span>`:`<button class="btn ghost sm" data-step="${k}">Laut geübt (+2)</button>`}</div>`; }).join("")}
  </div>
  <div class="tip">Tipp: Ersetze die Beispiele (Herr Batzner, Saulheim, 800 €) durch deine echten Leads und Zahlen. Unter „Mein Pitch“ geht das automatisch.</div>`;
}

/* --- Auftreten --- */
function auftritt(){
  return `<div class="card"><h2>Auftreten</h2><p class="sub">Menschen kaufen zuerst die Person, dann das Produkt. So wirkst du sicher und vertrauenswürdig.</p></div>
  <div class="grid">${PRESENCE.map(p=>`<div class="card"><h3>${esc(p[0])}</h3><p>${esc(p[1])}</p><div class="tip">${esc(p[2])}</div></div>`).join("")}</div>`;
}

/* --- Psychologie --- */
function psy(){
  return `<div class="card"><h2>Psychologie im Verkauf</h2><p class="sub">Zehn Prinzipien, die erklären, warum Menschen kaufen. Sie wirken am stärksten, wenn sie ehrlich eingesetzt werden. Wer trickst, verliert Vertrauen und Weiterempfehlungen.</p></div>
  ${PSY.map((p,i)=>`<details ${psyOpen==i?"open":""} data-psy="${i}"><summary>${i+1}. ${esc(p[0])}</summary>

/* --- Einwände --- */

  const c = OBJ[cardI], r = st.cards[cardI];
  const cnt = {g:0,y:0,r:0}; Object.values(st.cards).forEach(v=>cnt[v]++);
  return `<div class="card"><h2>Einwand-Training</h2>
  <p class="sub">Lies den Einwand, antworte <b>laut</b>, dann deck die Musterantwort auf und bewerte dich ehrlich.</p>
  <div class="row" style="margin-bottom:10px"><span class="badge g">Sicher: ${cnt.g}</span><span class="badge y">Fast: ${cnt.y}</span><span class="badge r">Üben: ${cnt.r}</span><span class="muted" style="font-size:14px">Karte ${cardI+1} von ${OBJ.length}</span></div>
  <div class="card" style="background:var(--bg)"><div class="flash">„${esc(c[0])}“</div></div>
  ${cardOpen?`<div class="say">„${esc(c[1])}“</div>
  <p class="why">Muster: erst Verständnis zeigen, dann eine Frage stellen. Nie diskutieren, sondern den wahren Grund herausfinden.</p>
  <div class="row"><button class="btn ok" data-rate="g">Sicher (+5)</button><button class="btn warn" data-rate="y">Fast (+2)</button><button class="btn bad" data-rate="r">Nochmal</button></div>`
  :`<button class="btn" data-act="open">Antwort aufdecken</button>`}
  <div class="row" style="margin-top:14px"><button class="btn ghost sm" data-act="prev">← Zurück</button><button class="btn ghost sm" data-act="next">Weiter →</button><button class="btn ghost sm" data-act="weak">Schwächste Karte</button>${r?`<span class="badge ${r}">${{g:"Sicher",y:"Fast",r:"Üben"}[r]}</span>`:""}</div></div>
  <div class="card"><h3>Alle Einwände im Überblick</h3>${OBJ.map((o,i)=>`<details><summary>${st.cards[i]?`<span class="badge ${st.cards[i]}">●</span>`:""}${esc(o[0])}</summary><div class="say">„${esc(o[1])}“</div></details>`).join("")}</div>`;
}

/* --- Simulator --- */
function sim(){
  if (simI >= SIMS.length) {
    const max = SIMS.length*10, pct = Math.round(simScore/max*100);
    return `<div class="card"><h2>Ergebnis: ${simScore} / ${max}</h2><div class="bar"><i style="width:${pct}%"></i></div>
    <p class="big">${pct>=80?"Stark! Jetzt ab ans echte Telefon.":pct>=50?"Gute Basis. Schau dir die Leitfäden nochmal an.":"Noch Luft nach oben. Lies den Kaltanruf-Leitfaden und versuch es nochmal."}</p>
    <button class="btn" data-act="simreset">Nochmal spielen</button></div>`;
  }
  const s = SIMS[simI];
  return `<div class="card"><div class="muted">Szene ${simI+1} von ${SIMS.length} · ${simScore} Punkte</div><div class="bar"><i style="width:${simI/SIMS.length*100}%"></i></div>
  <p class="big">${esc(s.s)}</p><p class="muted">Was sagst du?</p>
  ${s.o.map((o,i)=>{ let cls=""; if(simAns!==null){ cls = o[1]==10?"best":o[1]>0?"mid":(i==simAns?"wrong":""); } return `<button class="opt ${cls}" data-sim="${i}" ${simAns!==null?"disabled":""}>${esc(o[0])}</button>`; }).join("")}
  ${simAns!==null?`<div class="${s.o[simAns][1]==10?"tip":s.o[simAns][1]>0?"limit":"avoid"}">${s.o[simAns][1]==10?"✓ Sehr gut. ":s.o[simAns][1]>0?"~ Geht so. ":"✗ Lieber nicht. "}${esc(s.o[simAns][2])}</div>
  ${s.o[simAns][1]<10?`<p class="why">Beste Antwort: „${esc(s.o.find(o=>o[1]==10)[0])}“</p>`:""}
  <button class="btn" data-act="simnext">Weiter →</button>`:""}</div>`;
}

/* --- Quiz --- */
function quiz(){
  if (quizI >= QUIZ.length) {
    return `<div class="card"><h2>Quiz fertig: ${quizScore} / ${QUIZ.length}</h2><p class="muted">Bester Wert: ${st.quizBest} / ${QUIZ.length}</p><button class="btn" data-act="quizreset">Nochmal</button></div>`;
  }
  const q = QUIZ[quizI];
  return `<div class="card"><div class="muted">Frage ${quizI+1} von ${QUIZ.length} · ${quizScore} richtig</div><div class="bar"><i style="width:${quizI/QUIZ.length*100}%"></i></div>
  <p class="big">${esc(q[0])}</p>
  ${q[1].map((a,i)=>{ let cls=""; if(quizAns!==null){ if(i==q[2]) cls="best"; else if(i==quizAns) cls="wrong"; } return `<button class="opt ${cls}" data-quiz="${i}" ${quizAns!==null?"disabled":""}>${esc(a)}</button>`; }).join("")}
  ${quizAns!==null?`<div class="${quizAns==q[2]?"tip":"avoid"}">${quizAns==q[2]?"✓ Richtig. ":"✗ Nicht ganz. "}${esc(q[3])}</div><button class="btn" data-act="quiznext">Weiter →</button>`:""}</div>`;
}

/* --- Mein Pitch --- */
const PDEF = {prod:"KI-Terminbuchung", ziel:"Anwaltskanzleien", prob:"Mandantenanfragen gehen verloren, wenn niemand ans Telefon geht", nutzen:"bucht rund um die Uhr Termine direkt in den Kalender", beob:"man Termine nur telefonisch bekommt", fall:"3", wert:"800", setup:"2500", monat:"500"};
function pitch(){
  const p = Object.assign({}, PDEF, st.pitch);
  const f = (k,l,ph) => `<label>${l}</label><input data-p="${k}" value="${esc(p[k])}" placeholder="${esc(ph||"")}">`;
  return `<div class="card"><h2>Mein Pitch</h2><p class="sub">Trag dein Produkt und deinen Kunden ein, und du bekommst deinen persönlichen Leitfaden zum Üben.</p>
  <div class="grid" style="gap:10px">
  <div>${f("prod","Produkt")}${f("ziel","Zielgruppe")}${f("prob","Problem des Kunden")}${f("nutzen","Was dein Produkt macht")}</div>
  <div>${f("beob","Deine Beobachtung beim Kunden","z. B. keine Online-Buchung")}${f("fall","Verlorene Fälle pro Woche")}${f("wert","Wert pro Fall in €")}
  <div class="grid" style="grid-template-columns:1fr 1fr;gap:8px"><div>${f("setup","Einrichtung €")}</div><div>${f("monat","Monatlich €")}</div></div></div></div></div>
  <div class="card"><h3>Dein Leitfaden</h3><pre class="out" id="pout">${esc(pitchText(p))}</pre>
  <div class="row" style="margin-top:10px"><button class="btn" data-act="copy">Kopieren</button><button class="btn ghost" data-act="pitchdone">Laut geübt (+10)</button></div></div>`;
}
function pitchText(p){
  const n = v => Number(String(v).replace(/[^\d.]/g,"")) || 0;
  const fmt = v => Math.round(v).toLocaleString("de-DE") + " €";
  const lost = n(p.fall)*n(p.wert)*4.3, back = lost/3;
  const day = n(p.monat)/30;
  return `EIN-SATZ-PITCH
Ich helfe ${p.ziel} dabei, dass ${p.prob.charAt(0).toLowerCase()+p.prob.slice(1)} nicht mehr passiert: Meine ${p.prod} ${p.nutzen}.

KALTANRUF-EINSTIEG
„Guten Tag, hier ist [Name] von [Firma]. Ganz ehrlich, ich rufe unangekündigt an. Geben Sie mir 30 Sekunden, und dann entscheiden Sie, ob wir weiterreden?“
„Ich arbeite mit ${p.ziel}. Mir ist bei Ihnen aufgefallen, dass ${p.beob}. Darf ich Ihnen zwei kurze Fragen dazu stellen?“

FRAGEN
„Wie läuft das aktuell bei Ihnen?“
„Wie oft passiert das ungefähr pro Woche?“
„Was ist ein neuer Kunde für Sie im Schnitt wert?“

SCHMERZ BEWUSST MACHEN
„Wenn ich richtig rechne: ${p.fall} Fälle pro Woche mal ${fmt(n(p.wert))}, dann gehen Ihnen im Monat rund ${fmt(lost)} verloren. Ist das ungefähr realistisch?“

TERMIN
„Ich habe schon eine Vorschau vorbereitet, wie die ${p.prod} bei Ihnen aussehen würde. Passt Ihnen eher Dienstag um 10 oder Donnerstag um 14 Uhr?“

NUTZEN UND PREIS (im Termin)
„Wenn die Lösung nur jeden dritten verlorenen Fall rettet, sind das rund ${fmt(back)} im Monat.“
„Die Einrichtung kostet einmalig ${fmt(n(p.setup))}, danach ${fmt(n(p.monat))} im Monat, also rund ${fmt(day)} am Tag.“
„Sollen wir das so machen?“
→ Danach: schweigen.`;
}

/* --- Journal --- */
function journal(){
  return `<div class="card"><h2>Gesprächs-Journal</h2><p class="sub">Nach jedem echten Gespräch zwei Minuten reflektieren. So lernst du doppelt so schnell.</p>
  <label>Kunde / Kanzlei</label><input id="jK" placeholder="z. B. Kanzlei Batzner">
  <label>Ergebnis</label><select id="jE"><option>Nicht erreicht</option><option>Kein Interesse</option><option>Rückruf vereinbart</option><option>Demo-Termin</option><option>Angebot geschickt</option><option>Abschluss 🎉</option></select>
  <label>Welcher Einwand kam?</label><input id="jO" placeholder="z. B. Schicken Sie mir Infos per Mail">
  <label>Was lief gut?</label><textarea id="jG"></textarea>
  <label>Was mache ich beim nächsten Mal anders?</label><textarea id="jB"></textarea>
  <button class="btn" data-act="jadd" style="margin-top:10px">Eintrag speichern (+10)</button></div>
  ${st.journal.length?`<div class="card"><h3>Bisherige Einträge (${st.journal.length})</h3>${st.journal.slice().reverse().map((j,ri)=>{const i=st.journal.length-1-ri; return `<details><summary>${esc(j.d)} · ${esc(j.k||"ohne Namen")} · <span class="badge">${esc(j.e)}</span></summary>
  ${j.o?`<p><b>Einwand:</b> ${esc(j.o)}</p>`:""}${j.g?`<p><b>Gut:</b> ${esc(j.g)}</p>`:""}${j.b?`<p><b>Anders:</b> ${esc(j.b)}</p>`:""}<button class="btn ghost sm" data-jdel="${i}">Löschen</button></details>`;}).join("")}</div>`:""}`;
}

/* ===================== EVENTS ===================== */
document.addEventListener("click", e => {
  const d = e.target.closest("[data-tab],[data-act],[data-guide],[data-step],[data-rate],[data-sim],[data-quiz],[data-jdel],summary");
  if (!d) return;
  const ds = d.dataset;
  if (d.tagName=="SUMMARY") { const det=d.parentElement; if (det.dataset.psy!==undefined) psyOpen = det.open ? -1 : +det.dataset.psy; return; }
  if (ds.tab) return go(ds.tab);
  if (ds.guide) { guide = ds.guide; return render(); }
  if (ds.step) { st.done[ds.step]=1; addPts(2,"Schritt geübt"); return render(); }
  if (ds.rate) { const first = !st.cards[cardI]; st.cards[cardI]=ds.rate; if (ds.rate=="g") addPts(5,"Einwand sicher"); else if (ds.rate=="y") addPts(2,"Fast geschafft"); else save();
    cardI=(cardI+1)%OBJ.length; cardOpen=false; return render(); }
  if (ds.sim!==undefined) { simAns=+ds.sim; const p=SIMS[simI].o[simAns][1]; simScore+=p; if(p) addPts(p==10?10:2); return render(); }
  if (ds.quiz!==undefined) { quizAns=+ds.quiz; if (quizAns==QUIZ[quizI][2]) { quizScore++; addPts(5,"Richtig"); } return render(); }
  if (ds.jdel!==undefined) { if (confirm("Eintrag löschen?")) { st.journal.splice(+ds.jdel,1); save(); render(); } return; }
  switch (ds.act) {
    case "chal": st.chal[today()]=1; addPts(15,"Challenge geschafft"); render(); break;
    case "open": cardOpen=true; render(); break;
    case "next": cardI=(cardI+1)%OBJ.length; cardOpen=false; render(); break;
    case "prev": cardI=(cardI-1+OBJ.length)%OBJ.length; cardOpen=false; render(); break;
    case "weak": { const order={undefined:0,r:1,y:2,g:3}; let best=0; OBJ.forEach((_,i)=>{ if(order[st.cards[i]]<order[st.cards[best]]) best=i; }); cardI=best; cardOpen=false; render(); break; }
    case "simnext": simI++; simAns=null; if (simI>=SIMS.length && simScore>st.simBest) { st.simBest=simScore; save(); } render(); break;
    case "simreset": simI=0; simScore=0; simAns=null; render(); break;
    case "quiznext": quizI++; quizAns=null; if (quizI>=QUIZ.length && quizScore>st.quizBest) { st.quizBest=quizScore; save(); } render(); break;
    case "quizreset": quizI=0; quizScore=0; quizAns=null; render(); break;
    case "copy": { const t=$("pout").textContent; (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("Kopiert"),()=>toast("Kopieren nicht möglich, bitte markieren")); break; }
    case "pitchdone": addPts(10,"Pitch geübt"); break;
    case "jadd": { const v=id=>$(id).value.trim(); st.journal.push({d:today(),k:v("jK"),e:$("jE").value,o:v("jO"),g:v("jG"),b:v("jB")}); addPts(10,"Journal-Eintrag"); render(); break; }
    case "export": { const b=new Blob([JSON.stringify(st,null,1)],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download="verkaufs-trainer-"+today()+".json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); break; }
  }
});
document.addEventListener("input", e => {
  const k = e.target.dataset.p; if (!k) return;
  st.pitch[k] = e.target.value; save();
  const o = $("pout"); if (o) o.textContent = pitchText(Object.assign({}, PDEF, st.pitch));
});
document.addEventListener("change", e => {
  if (e.target.id!="imp" || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => { try { const x=JSON.parse(r.result); if (typeof x.pts!="number") throw 0; st=Object.assign(st,x); save(); stats(); nav(); render(); toast("Sicherung geladen"); } catch(_) { toast("Keine gültige Sicherung"); } };
  r.readAsText(e.target.files[0]);
});

stats(); nav(); render();
</script>
</body>
</html>
