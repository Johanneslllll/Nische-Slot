<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Niche Slot – Erst verkaufen, dann bauen</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f8fc;--card:#fff;--line:#e5e9f2;--t:#0a0f1c;--m:#667085;--b:#1d5bff;--b2:#e8efff;--ok:#0f9d58;--warn:#e8a200}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,sans-serif;color:var(--t);background:var(--bg);padding:28px;min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(60% 40% at 50% -10%,#1d5bff22,transparent),linear-gradient(#0a0f1c08 1px,transparent 1px),linear-gradient(90deg,#0a0f1c08 1px,transparent 1px);background-size:auto,56px 56px,56px 56px}
.wrap{max-width:1200px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:24px}
h1{font-size:34px;font-weight:800;letter-spacing:-.03em}h1 span{color:var(--b)}
.tag{color:var(--m);font-size:14px;margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 1px 2px #0a0f1c0a,0 8px 24px -12px #0a0f1c1f}
.card h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--m);margin:0 0 12px;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
.v{font-size:28px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats .card:first-child .v{color:var(--b)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:18px;padding:5px;border:1px solid var(--line);border-radius:999px;background:#fff;width:fit-content}
.tab{border:0;background:transparent;color:var(--m);padding:10px 16px;border-radius:999px;font:600 14px Inter;cursor:pointer}
.tab:hover{color:var(--t)}.tab.on{background:var(--t);color:#fff}.tab.lock{opacity:.4}
.pane{display:none}.pane.on{display:block;animation:in .3s}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.reel{height:160px;border-radius:16px;overflow:hidden;position:relative;background:linear-gradient(#f1f4fa,#fff 50%,#f1f4fa);border:1px solid var(--line)}
.reel::before{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:var(--b);opacity:.15;z-index:2}
.reel::after{content:"";position:absolute;inset:0;box-shadow:inset 0 40px 30px -28px #fff,inset 0 -40px 30px -28px #fff;pointer-events:none;z-index:2}
.strip{position:absolute;width:100%}.item{height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;font-weight:800;font-size:19px}
.item small{font-size:10px;letter-spacing:.18em;color:var(--b);margin-bottom:8px;font-weight:700}
.btn{border:0;border-radius:999px;padding:14px 28px;font:700 15px Inter;color:#fff;cursor:pointer;background:var(--b);transition:.2s;box-shadow:0 8px 20px -8px var(--b)}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}.btn:disabled{opacity:.4}
.ghost{background:#fff;border:1px solid var(--line);box-shadow:none;color:var(--t);padding:10px 16px;font-size:13px}
.ghost:hover{border-color:var(--b);color:var(--b)}
.sm{padding:6px 12px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.say{position:relative;border-left:3px solid var(--b);padding:12px 16px 12px 16px;background:var(--b2);border-radius:0 12px 12px 0;margin:8px 0 14px;line-height:1.65}
.say.alt{border-color:var(--t);background:#f1f3f7}
.cp{position:absolute;top:8px;right:8px;border:1px solid var(--line);background:#fff;border-radius:8px;font:600 11px Inter;padding:3px 8px;cursor:pointer;color:var(--m)}
.step{font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--b);text-transform:uppercase;margin-top:16px}
.tip{font-size:13px;color:var(--m);margin:-6px 0 10px}
p.txt{line-height:1.65;color:#2b3345;margin-bottom:10px}
.chk label{display:flex;gap:12px;align-items:flex-start;padding:10px;border-radius:12px;cursor:pointer;line-height:1.5}
.chk label:hover{background:#f4f6fb}.chk input{accent-color:var(--b);width:18px;height:18px;margin-top:3px}
.chk input:checked+span{text-decoration:line-through;color:var(--m)}
details{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;background:#fff}
details[open]{border-color:var(--b)}summary{cursor:pointer;font-weight:700}details>div{margin-top:10px;line-height:1.65;color:#2b3345}
.bar{height:6px;background:#eceff5;border-radius:9px;overflow:hidden;margin:6px 0 14px}.bar i{display:block;height:100%;background:var(--b);transition:.4s}
.goal{display:flex;justify-content:space-between;font-weight:600;font-size:14px}
input[type=text],input[type=tel],input[type=number],input[type=date],select,textarea{font:500 14px Inter;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--t);width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--b2);border-color:var(--b)}
table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--m);padding:8px}
td{padding:8px;border-top:1px solid var(--line);vertical-align:middle}td select,td input{padding:6px 8px;font-size:13px}
.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--b2);color:var(--b)}
.badge.ok{background:#e6f6ed;color:var(--ok)}.badge.warn{background:#fff6dc;color:#9a6b00}
.mission{background:var(--t);color:#fff;border:0}.mission h3{color:#9fb4ff}.mission .big{font-size:22px;font-weight:800;line-height:1.4}
.muted{color:var(--m);font-size:13px}
@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}.tabs{width:auto;border-radius:18px}table{font-size:12px}}
</style></head><body><div class="wrap">
<header><div><h1>Niche <span>Slot</span></h1><p class="tag">Erst verkaufen, dann bauen. Dein 30-Tage-Sprint für die KI-Agentur.</p></div>
<span class="muted" id="sync" style="margin-right:10px">lokal</span><button class="btn ghost" id="reset">Sprint zurücksetzen</button></header>
<div class="stats" id="stats"></div>
<div class="tabs" id="tabs"></div>
<div id="panes"></div>
</div>
<script src="data.js"></script><script src="app.js"></script>
</body></html>
